; Cardputer firmware. Long-polls the laptop broker; runs no server itself.

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3   ; Cardputer is a StampS3-based device
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCARDPUTER_ADV
    -DBOARD_HAS_PSRAM
build_src_filter = +<*> +<buddies/> +<core/>
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5Cardputer @ ^1.0.3
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
